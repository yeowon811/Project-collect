<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신청자 접수 페이지</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #f8f9fa;
        }

        /* ================= 1. 인트로 영상 화면 ================= */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9999;
            transition: opacity 1s ease; /* 자연스럽게 사라지는 페이드아웃 효과 */
        }

        #introVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .skip-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.8);
            color: #000;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            transition: background 0.3s;
        }

        .skip-btn:hover {
            background-color: #ffffff;
        }

        /* ================= 2. 신청서 메인 화면 ================= */
        .container {
            max-width: 480px;
            margin: 60px auto;
            padding: 30px 25px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-title {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="tel"]:focus {
            border-color: #007bff;
        }

        /* 라디오 버튼 (성별 선택) */
        .gender-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .gender-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
        }

        /* 제출 버튼 */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- 🎬 1. 인트로 동영상 레이어 -->
    <div id="intro-overlay">
        <button class="skip-btn" onclick="hideIntro()">건너뛰기 Skip &gt;</button>
        <video id="introVideo" autoplay muted playsinline>
            <!-- 지정하신 로컬 절대경로 적용 -->
            <source src="C:/Users/LG/Downloads/제목 없는 동영상.mp4" type="video/mp4">
            브라우저가 동영상을 지원하지 않습니다.
        </video>
    </div>

    <!-- 📝 2. 신청자 입력 화면 -->
    <div class="container">
        <h2 class="form-title">신청자 정보 입력</h2>
        
        <form id="applicationForm" onsubmit="handleSubmit(event)">
            <!-- 이름 -->
            <div class="form-group">
                <label for="name">이름 *</label>
                <input type="text" id="name" name="name" placeholder="홍길동" required>
            </div>

            <!-- 성별 -->
            <div class="form-group">
                <label>성별 *</label>
                <div class="gender-group">
                    <label>
                        <input type="radio" name="gender" value="남성" required> 남성
                    </label>
                    <label>
                        <input type="radio" name="gender" value="여성"> 여성
                    </label>
                </div>
            </div>

            <!-- 전화번호 -->
            <div class="form-group">
                <label for="phone">전화번호 *</label>
                <input type="tel" id="phone" name="phone" placeholder="010-1234-5678" pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}" required>
            </div>

            <!-- 제출 버튼 -->
            <button type="submit" class="submit-btn">신청하기</button>
        </form>
    </div>

    <script>
        const video = document.getElementById('introVideo');
        const overlay = document.getElementById('intro-overlay');

        // 1. 영상 종료 및 건너뛰기 처리
        function hideIntro() {
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 1000); // 1초 페이드아웃 후 화면에서 완전 제거
        }

        // 동영상 재생 완료 시 hideIntro() 자동 실행
        video.addEventListener('ended', hideIntro);

        // 2. 신청서 제출 처리
        function handleSubmit(event) {
            event.preventDefault(); // 페이지 새로고침 방지

            // 입력값 취득
            const name = document.getElementById('name').value;
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const phone = document.getElementById('phone').value;

            // 완료 알림창
            alert(`신청이 완료되었습니다!\n\n- 이름: ${name}\n- 성별: ${gender}\n- 연락처: ${phone}`);

            // 폼 입력 내용 초기화
            document.getElementById('applicationForm').reset();
        }
    </script>
</body>
</html>
