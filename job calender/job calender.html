<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채용 공고 일정 캘린더</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f6f2;
            --card-bg: transparent;
            --border-color: #d5d2ca;
            --text-main: #2a2a2a;
            --text-sub: #7a7873;
            --primary-color: #2a2a2a;
            --danger-color: #8c5b5b;
            --hover-bg: #e8e6e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Jost', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            font-weight: 300;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 24px;
        }

        .container {
            max-width: 1360px;
            margin: 0 auto;
        }

        /* 상단 대시보드 그리드 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr) minmax(0, 1.5fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        @media (max-width: 1180px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .profile-card {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

            .card-head h3 {
                font-size: 0.85rem;
                font-weight: 400;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                display: flex;
                align-items: center;
                gap: 6px;
            }

        /* 설정 톱니바퀴 버튼 */
        .settings-toggle-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-sub);
            padding: 2px 4px;
            transition: color 0.2s, transform 0.2s;
            line-height: 1;
        }

            .settings-toggle-btn:hover {
                color: var(--text-main);
                transform: rotate(30deg);
            }

            .settings-toggle-btn.active {
                color: var(--text-main);
                transform: rotate(90deg);
            }

        .profile-info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px 16px;
        }

        .profile-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

            .profile-field label {
                font-size: 0.7rem;
                color: var(--text-sub);
                font-weight: 400;
                letter-spacing: 0.05em;
            }

        .profile-input {
            width: 100%;
            padding: 6px 0;
            border: none;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            background: transparent;
            color: var(--text-main);
            transition: border-color 0.3s;
        }

            .profile-input:focus {
                border-bottom-color: var(--primary-color);
                outline: none;
            }

        .profile-link-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .profile-link-wrapper .profile-input {
                flex: 1 1 auto;
                min-width: 0;
            }

        .profile-open-btn {
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            text-decoration: none;
            flex-shrink: 0;
            transition: all 0.2s ease;
            text-transform: uppercase;
            pointer-events: auto;
        }

            .profile-open-btn:hover {
                border-color: var(--text-main);
                background-color: var(--hover-bg);
            }

            .profile-open-btn.disabled {
                opacity: 0.35;
                cursor: not-allowed;
                pointer-events: none;
                border-color: var(--border-color);
            }

        /* 어학 폼 및 뱃지 */
        .spec-form {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

            .spec-form input {
                padding: 6px 0;
                border: none;
                border-bottom: 1px solid var(--border-color);
                background: transparent;
                font-size: 0.8rem;
            }

                .spec-form input:focus {
                    outline: none;
                    border-bottom-color: var(--primary-color);
                }

        .spec-name-input {
            flex: 1 1 auto;
            min-width: 0;
        }

        .spec-detail-input {
            width: 85px;
            flex-shrink: 0;
        }

        .spec-tags-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 48px;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .lang-badge {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background-color: transparent;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 0;
            font-size: 0.85rem;
            width: fit-content;
        }

            .lang-badge .spec-detail-text {
                color: var(--text-sub);
                font-size: 0.75rem;
                margin-left: 6px;
            }

        /* 자격증 입력 폼 & 목록 */
        .cert-form-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 0.9fr) minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
            width: 100%;
        }

            .cert-form-grid input {
                width: 100%;
                min-width: 0;
                padding: 6px 0;
                border: none;
                border-bottom: 1px solid var(--border-color);
                background: transparent;
                font-size: 0.75rem;
                color: var(--text-main);
            }

                .cert-form-grid input:focus {
                    outline: none;
                    border-bottom-color: var(--primary-color);
                }

        .cert-badge-row {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 0.9fr) minmax(0, 1fr);
            gap: 8px;
            align-items: center;
            width: 100%;
            padding: 7px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.78rem;
            transition: background 0.15s ease, opacity 0.15s ease;
        }

            /* 설정 모드 활성화 시 드래그 핸들과 삭제 버튼 컬럼 추가 */
            .cert-badge-row.edit-mode {
                grid-template-columns: auto minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 0.9fr) minmax(0, 1fr) auto;
            }

            .cert-badge-row.dragging {
                opacity: 0.35;
                background: var(--hover-bg);
            }

            .cert-badge-row.drag-over {
                border-top: 2px solid var(--primary-color);
            }

        .drag-handle {
            cursor: grab;
            color: var(--text-sub);
            font-size: 0.85rem;
            padding: 0 4px;
            user-select: none;
            display: inline-flex;
            align-items: center;
            line-height: 1;
        }

            .drag-handle:active {
                cursor: grabbing;
            }

        .cert-badge-row .cert-col {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            user-select: text;
        }

        .cert-badge-row .cert-col-name {
            font-weight: 400;
            color: var(--text-main);
        }

        .cert-badge-row .cert-col-sub {
            color: var(--text-sub);
            font-size: 0.72rem;
        }

        .spec-delete-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.75rem;
            transition: color 0.2s;
            padding: 0 4px;
            flex-shrink: 0;
        }

            .spec-delete-btn:hover {
                color: var(--danger-color);
            }

        .empty-spec-msg {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin: auto 0;
            letter-spacing: 0.05em;
        }

        /* 캘린더 & 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 32px;
            background: transparent;
            padding: 0 0 16px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .title-area h1 {
            font-size: 1.4rem;
            font-weight: 200;
            letter-spacing: 0.3em;
        }

        .controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            padding: 6px 16px;
            border: 1px solid var(--text-main);
            background: transparent;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

            .btn:hover {
                background: var(--text-main);
                color: var(--bg-color);
            }

        .btn-primary {
            border-color: var(--text-main);
        }

        .btn-danger {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

            .btn-danger:hover {
                background: var(--danger-color);
                color: #fff;
            }

            .btn-danger.active-mode {
                background-color: var(--danger-color);
                color: #fff;
            }

        .btn-warning {
            border-color: var(--text-sub);
            color: var(--text-sub);
        }

            .btn-warning:hover {
                background: var(--text-sub);
                color: #fff;
            }

        .file-label {
            padding: 6px 16px;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

            .file-label:hover {
                background-color: var(--text-main);
                color: var(--bg-color);
            }

        input[type="file"] {
            display: none;
        }

        .calendar-container {
            background: transparent;
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

            .month-nav h2 {
                font-size: 1.2rem;
                font-weight: 300;
                letter-spacing: 0.15em;
            }

        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 400;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: var(--text-sub);
            padding-bottom: 12px;
            text-transform: uppercase;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(140px, auto);
            border-left: 1px solid var(--border-color);
            border-top: 1px solid var(--border-color);
        }

        .day-cell {
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 10px;
            background: transparent;
            position: relative;
        }

            .day-cell.other-month {
                background: rgba(0, 0, 0, 0.02);
                color: #d1cfc7;
            }

        .day-number {
            font-size: 0.8rem;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .day-cell.sunday .day-number {
            color: #a17070;
        }

        .day-cell.saturday .day-number {
            color: #7084a1;
        }

        .events-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .job-card-wrapper {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            border-left-width: 3px;
            background-color: transparent;
        }

        .job-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            font-size: 0.75rem;
            background-color: transparent !important;
            color: var(--text-main) !important;
        }

        .job-card-wrapper.color-indigo {
            border-left-color: #6366f1;
        }

        .job-card-wrapper.color-emerald {
            border-left-color: #72a38b;
        }

        .job-card-wrapper.color-amber {
            border-left-color: #bfa173;
        }

        .job-card-wrapper.color-rose {
            border-left-color: #b87a85;
        }

        .job-card-wrapper.color-purple {
            border-left-color: #8979a6;
        }

        .delete-checkbox {
            margin-right: 4px;
        }

        .job-company {
            font-weight: 400;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1 1 auto;
            letter-spacing: 0.03em;
        }

            .job-company:hover {
                text-decoration: underline;
            }

        .job-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .job-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 2px 4px;
            color: var(--text-sub);
            transition: color 0.2s;
        }

            .job-btn:hover {
                color: var(--text-main);
            }

        .job-btn-word {
            font-weight: 500;
            border: 1px solid var(--border-color);
        }

            .job-btn-word:hover {
                border-color: var(--text-main);
            }

        .job-memo-box {
            font-size: 0.7rem;
            padding: 6px 8px;
            background-color: transparent;
            color: var(--text-sub);
            border-top: 1px dashed var(--border-color);
            word-break: break-all;
            white-space: pre-wrap;
        }

        .job-link-box {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            font-size: 0.7rem;
            background-color: var(--hover-bg);
            border-top: 1px solid var(--border-color);
        }

        .job-sub-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 0.03em;
        }

            .job-sub-link:hover {
                text-decoration: underline;
            }

        /* 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(247, 246, 242, 0.85);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

            .modal-overlay.active {
                display: flex;
            }

        .modal {
            background: var(--bg-color);
            padding: 32px;
            border: 1px solid var(--text-main);
            width: 400px;
            box-shadow: 12px 12px 0px rgba(0,0,0,0.04);
        }

            .modal h3 {
                font-size: 1rem;
                font-weight: 400;
                letter-spacing: 0.1em;
                margin-bottom: 24px;
                text-transform: uppercase;
            }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                font-size: 0.75rem;
                letter-spacing: 0.05em;
                margin-bottom: 8px;
                color: var(--text-sub);
            }

            .form-group input[type="text"],
            .form-group input[type="date"],
            .form-group textarea {
                width: 100%;
                padding: 8px 0;
                border: none;
                border-bottom: 1px solid var(--border-color);
                background: transparent;
                font-size: 0.85rem;
                color: var(--text-main);
            }

                .form-group input:focus, .form-group textarea:focus {
                    outline: none;
                    border-bottom-color: var(--text-main);
                }

        .color-picker-group {
            display: flex;
            gap: 12px;
        }

        .color-swatch {
            width: 24px;
            height: 24px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

            .color-swatch.selected {
                border: 1px solid #000;
                transform: scale(1.1);
            }

        .modal textarea {
            height: 60px;
            resize: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 대시보드 -->
        <div class="dashboard-grid">
            <div class="profile-card">
                <div class="card-head">
                    <h3>PROFILE</h3>
                </div>
                <div class="profile-info-grid">
                    <div class="profile-field">
                        <label for="profName">이름</label>
                        <input type="text" id="profName" class="profile-input" placeholder="윤여원">
                    </div>
                    <div class="profile-field">
                        <label for="profTarget">희망 직무</label>
                        <input type="text" id="profTarget" class="profile-input" placeholder="">
                    </div>
                    <div class="profile-field">
                        <label for="profSchool">학교 / 전공</label>
                        <input type="text" id="profSchool" class="profile-input" placeholder="컴퓨터학부">
                    </div>
                    <div class="profile-field">
                        <label for="profGpa">학점</label>
                        <input type="text" id="profGpa" class="profile-input" placeholder=" ">
                    </div>
                </div>
                <div class="profile-field">
                    <label for="profPortfolio">포트폴리오 링크</label>
                    <div class="profile-link-wrapper">
                        <input type="text" id="profPortfolio" class="profile-input" placeholder="notion.so/my-portfolio">
                        <a href="javascript:void(0);" id="profPortfolioLink" target="_blank" rel="noopener noreferrer" class="profile-open-btn disabled">OPEN ↗</a>
                    </div>
                </div>
                <div class="profile-field">
                    <label for="profGithub">GitHub 링크</label>
                    <div class="profile-link-wrapper">
                        <input type="text" id="profGithub" class="profile-input" placeholder="github.com/username">
                        <a href="javascript:void(0);" id="profGithubLink" target="_blank" rel="noopener noreferrer" class="profile-open-btn disabled">OPEN ↗</a>
                    </div>
                </div>
            </div>

            <div class="profile-card">
                <div class="card-head">
                    <h3>LANGUAGES</h3>
                </div>
                <div class="spec-form">
                    <input type="text" id="newLangName" class="spec-name-input" placeholder="TOEIC, AL 등">
                    <input type="text" id="newLangDetail" class="spec-detail-input" placeholder="점수/등급">
                    <button class="btn" id="addLangBtn" style="padding: 4px 8px;">ADD</button>
                </div>
                <div class="spec-tags-container" id="langContainer">
                    <span class="empty-spec-msg">등록된 어학 점수가 없습니다.</span>
                </div>
            </div>

            <div class="profile-card">
                <div class="card-head">
                    <h3>CERTIFICATES</h3>
                    <button type="button" class="settings-toggle-btn" id="certSettingsToggleBtn" title="자격증 순서 변경 및 삭제 설정 토글">⚙</button>
                </div>
                <div class="cert-form-grid">
                    <input type="text" id="newCertName" placeholder="자격증명">
                    <input type="text" id="newCertNumber" placeholder="자격번호">
                    <input type="text" id="newCertDate" placeholder="취득일 (YY.MM)">
                    <input type="text" id="newCertOrg" placeholder="발급기관">
                    <button class="btn" id="addCertBtn" style="padding: 4px 8px;">ADD</button>
                </div>
                <div class="spec-tags-container" id="certContainer">
                    <span class="empty-spec-msg">등록된 자격증이 없습니다.</span>
                </div>
            </div>
        </div>

        <header>
            <div class="title-area">
                <h1>RECRUITMENT CALENDAR</h1>
            </div>
            <div class="controls">
                <button class="btn" id="openAddJobModalBtn">+ ADD JOB</button>
                <button class="btn btn-danger" id="toggleDeleteModeBtn">DELETE</button>
                <button class="btn btn-warning" id="resetAllBtn">RESET</button>
                <label class="file-label" title="바탕화면의 jobs_data.json 파일을 선택하세요">
                    IMPORT JSON
                    <input type="file" id="jsonFileInput" accept=".json">
                </label>
                <span id="loadStatus" style="font-size: 0.7rem; color: var(--text-sub); letter-spacing:0.05em;">No Data</span>
            </div>
        </header>

        <div class="calendar-container">
            <div class="month-nav">
                <button class="btn" id="prevMonthBtn" style="border:none; padding:4px;">&lt; PREV</button>
                <h2 id="calendarTitle">2026. 09</h2>
                <button class="btn" id="nextMonthBtn" style="border:none; padding:4px;">NEXT &gt;</button>
            </div>

            <div class="weekdays-grid">
                <div style="color: #a17070;">SUN</div>
                <div>MON</div>
                <div>TUE</div>
                <div>WED</div>
                <div>THU</div>
                <div>FRI</div>
                <div style="color: #7084a1;">SAT</div>
            </div>

            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- 공고 직접 추가 모달 -->
    <div class="modal-overlay" id="addJobModal">
        <div class="modal">
            <h3>새 채용 공고 추가</h3>
            <div class="form-group">
                <label for="newCompanyName">회사 이름 *</label>
                <input type="text" id="newCompanyName" placeholder="카카오, 네이버">
            </div>
            <div class="form-group">
                <label for="newJobEndDate">마감일 *</label>
                <input type="date" id="newJobEndDate">
            </div>
            <div class="form-group">
                <label for="newJobLink">회사명 클릭 이동 링크</label>
                <input type="text" id="newJobLink" placeholder="www.naver.com">
            </div>
            <div class="modal-actions">
                <button class="btn" id="closeAddJobModalBtn">CANCEL</button>
                <button class="btn btn-primary" id="saveNewJobBtn">SAVE</button>
            </div>
        </div>
    </div>

    <!-- 공고 설정 모달 -->
    <div class="modal-overlay" id="customModal">
        <div class="modal">
            <h3 id="modalCompanyTitle">공고 설정</h3>
            <div class="form-group">
                <label>중요도 색상 태그</label>
                <div class="color-picker-group">
                    <div class="color-swatch selected" data-color="indigo" style="background-color: #6366f1;"></div>
                    <div class="color-swatch" data-color="emerald" style="background-color: #72a38b;"></div>
                    <div class="color-swatch" data-color="amber" style="background-color: #bfa173;"></div>
                    <div class="color-swatch" data-color="rose" style="background-color: #b87a85;"></div>
                    <div class="color-swatch" data-color="purple" style="background-color: #8979a6;"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="modalMemo">나만의 메모</label>
                <textarea id="modalMemo" placeholder="자소서 3번 문항 체크 등"></textarea>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="modalShowQuickLink">
                    <label for="modalShowQuickLink" style="margin-bottom:0;">바로가기 칸 표시</label>
                </div>
            </div>

            <div class="form-group" id="quickLinkInputGroup">
                <label for="modalQuickLink">바로가기 하이퍼링크</label>
                <input type="text" id="modalQuickLink" placeholder="www.saramin.co.kr">
            </div>

            <div class="modal-actions">
                <button class="btn" id="closeModalBtn">CANCEL</button>
                <button class="btn btn-primary" id="saveCustomBtn">SAVE</button>
            </div>
        </div>
    </div>

    <!-- 선택 삭제 확인 모달 -->
    <div class="modal-overlay" id="confirmDeleteModal">
        <div class="modal" style="width: 320px; text-align: center;">
            <h3 style="margin-bottom: 12px;">공고 삭제</h3>
            <p style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 28px; line-height:1.6;">
                선택한 공고를 삭제하시겠습니까?<br>
                입력된 메모 및 설정값도 함께 초기화됩니다.
            </p>
            <div class="modal-actions" style="justify-content: center;">
                <button class="btn" id="btnDeleteNo">NO</button>
                <button class="btn btn-danger" id="btnDeleteYes">YES</button>
            </div>
        </div>
    </div>

    <!-- 전체 초기화 확인 모달 -->
    <div class="modal-overlay" id="confirmResetAllModal">
        <div class="modal" style="width: 340px; text-align: center;">
            <h3 style="margin-bottom: 12px; color: var(--danger-color);">데이터 전체 초기화</h3>
            <p style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 28px; line-height:1.6;">
                등록된 모든 채용 공고와<br>
                입력된 메모, 링크, 색상 설정이 삭제됩니다.<br>
                진행하시겠습니까?
            </p>
            <div class="modal-actions" style="justify-content: center;">
                <button class="btn" id="btnResetAllNo">CANCEL</button>
                <button class="btn btn-danger" id="btnResetAllYes">RESET ALL</button>
            </div>
        </div>
    </div>

    <script>
        let jobsData = [];
        let currentDate = new Date(2026, 8, 1);
        let activeCustomId = null;
        let isDeleteMode = false;
        let selectedJobIdsToDelete = new Set();

        const STORAGE_KEY = "JOB_CALENDAR_CUSTOMIZATIONS";
        const JOBS_STORAGE_KEY = "JOB_CALENDAR_MANUAL_JOBS";
        const PROFILE_STORAGE_KEY = "JOB_CALENDAR_USER_PROFILE";
        const CERTS_STORAGE_KEY = "JOB_CALENDAR_USER_CERTS";
        const LANGS_STORAGE_KEY = "JOB_CALENDAR_USER_LANGS";

        function normalizeUrl(url) {
            if (!url) return '';
            const trimmed = String(url).trim();
            if (!trimmed || trimmed === '#') return '';
            if (/^https?:\/\//i.test(trimmed)) return trimmed;
            return 'https://' + trimmed;
        }

        /* 1. 프로필 관리 */
        const profileInputs = ['profName', 'profTarget', 'profSchool', 'profGpa', 'profPortfolio', 'profGithub'];

        function updateProfileLinkButton(inputId, linkBtnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(linkBtnId);
            if (!input || !btn) return;

            const url = normalizeUrl(input.value);
            if (url) {
                btn.href = url;
                btn.classList.remove('disabled');
            } else {
                btn.href = 'javascript:void(0);';
                btn.classList.add('disabled');
            }
        }

        function loadProfile() {
            const saved = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || '{}');
            profileInputs.forEach(id => {
                const el = document.getElementById(id);
                if (el && saved[id]) {
                    el.value = saved[id];
                }
                if (el) {
                    el.addEventListener('input', () => {
                        saveProfile();
                        if (id === 'profPortfolio') updateProfileLinkButton('profPortfolio', 'profPortfolioLink');
                        if (id === 'profGithub') updateProfileLinkButton('profGithub', 'profGithubLink');
                    });
                }
            });
            updateProfileLinkButton('profPortfolio', 'profPortfolioLink');
            updateProfileLinkButton('profGithub', 'profGithubLink');
        }

        function saveProfile() {
            const data = {};
            profileInputs.forEach(id => {
                const el = document.getElementById(id);
                if (el) data[id] = el.value;
            });
            localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(data));
        }

        /* 2. 자격증 관리 (설정 토글 및 텍스트 선택 보존 드래그) */
        let draggedIndex = null;
        let isCertEditMode = false;

        const certSettingsToggleBtn = document.getElementById('certSettingsToggleBtn');
        certSettingsToggleBtn.addEventListener('click', () => {
            isCertEditMode = !isCertEditMode;
            certSettingsToggleBtn.classList.toggle('active', isCertEditMode);
            renderCerts();
        });

        function getSavedCerts() {
            return JSON.parse(localStorage.getItem(CERTS_STORAGE_KEY) || '[]');
        }

        function persistCerts(certs) {
            localStorage.setItem(CERTS_STORAGE_KEY, JSON.stringify(certs));
        }

        function renderCerts() {
            const certs = getSavedCerts();
            const container = document.getElementById('certContainer');

            if (certs.length === 0) {
                container.innerHTML = '<span class="empty-spec-msg">등록된 자격증이 없습니다.</span>';
                return;
            }

            container.innerHTML = '';
            certs.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'cert-badge-row' + (isCertEditMode ? ' edit-mode' : '');
                row.dataset.index = index;

                let rowHtml = '';

                // 설정 모드 ON일 때만 드래그 핸들 노출
                if (isCertEditMode) {
                    rowHtml += `<span class="drag-handle" draggable="true" title="드래그하여 순서 변경">⋮⋮</span>`;
                }

                rowHtml += `
                        <span class="cert-col cert-col-name" title="${item.name || ''}">${item.name || '-'}</span>
                        <span class="cert-col cert-col-sub" title="${item.number || ''}">${item.number || '-'}</span>
                        <span class="cert-col cert-col-sub" title="${item.date || ''}">${item.date || '-'}</span>
                        <span class="cert-col cert-col-sub" title="${item.org || ''}">${item.org || '-'}</span>
                    `;

                // 설정 모드 ON일 때만 삭제 버튼 노출
                if (isCertEditMode) {
                    rowHtml += `<button class="spec-delete-btn" title="삭제" data-index="${index}">✕</button>`;
                }

                row.innerHTML = rowHtml;

                // 드래그 이벤트: 핸들에만 dragstart를 걸어 텍스트 드래그(선택) 방해 방지
                if (isCertEditMode) {
                    const handle = row.querySelector('.drag-handle');
                    if (handle) {
                        handle.addEventListener('dragstart', (e) => {
                            draggedIndex = index;
                            e.dataTransfer.effectAllowed = 'move';
                            e.dataTransfer.setData('text/plain', index);
                            row.classList.add('dragging');
                        });

                        handle.addEventListener('dragend', () => {
                            row.classList.remove('dragging');
                            document.querySelectorAll('.cert-badge-row').forEach(r => r.classList.remove('drag-over'));
                        });
                    }

                    row.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        row.classList.add('drag-over');
                    });

                    row.addEventListener('dragleave', () => {
                        row.classList.remove('drag-over');
                    });

                    row.addEventListener('drop', (e) => {
                        e.preventDefault();
                        row.classList.remove('drag-over');
                        const targetIndex = Number(row.dataset.index);
                        if (draggedIndex !== null && draggedIndex !== targetIndex) {
                            const updatedCerts = getSavedCerts();
                            const [movedItem] = updatedCerts.splice(draggedIndex, 1);
                            updatedCerts.splice(targetIndex, 0, movedItem);
                            persistCerts(updatedCerts);
                            renderCerts();
                        }
                    });

                    const delBtn = row.querySelector('.spec-delete-btn');
                    if (delBtn) {
                        delBtn.addEventListener('click', () => {
                            deleteCert(index);
                        });
                    }
                }

                container.appendChild(row);
            });
        }

        function addCert() {
            const nameEl = document.getElementById('newCertName');
            const numEl = document.getElementById('newCertNumber');
            const dateEl = document.getElementById('newCertDate');
            const orgEl = document.getElementById('newCertOrg');

            const name = nameEl.value.trim();
            if (!name) {
                alert('자격증명을 입력해주세요.');
                nameEl.focus();
                return;
            }

            const certs = getSavedCerts();
            certs.push({
                name: name,
                number: numEl.value.trim(),
                date: dateEl.value.trim(),
                org: orgEl.value.trim()
            });

            persistCerts(certs);

            nameEl.value = '';
            numEl.value = '';
            dateEl.value = '';
            orgEl.value = '';
            renderCerts();
        }

        function deleteCert(index) {
            const certs = getSavedCerts();
            certs.splice(index, 1);
            persistCerts(certs);
            renderCerts();
        }

        document.getElementById('addCertBtn').addEventListener('click', addCert);
        ['newCertName', 'newCertNumber', 'newCertDate', 'newCertOrg'].forEach(id => {
            document.getElementById(id).addEventListener('keydown', (e) => {
                if (e.key === 'Enter') addCert();
            });
        });

        /* 3. 어학 관리 */
        function getSavedLangs() {
            return JSON.parse(localStorage.getItem(LANGS_STORAGE_KEY) || '[]');
        }

        function persistLangs(langs) {
            localStorage.setItem(LANGS_STORAGE_KEY, JSON.stringify(langs));
        }

        function renderLangs() {
            const langs = getSavedLangs();
            const container = document.getElementById('langContainer');

            if (langs.length === 0) {
                container.innerHTML = '<span class="empty-spec-msg">등록된 어학 점수가 없습니다.</span>';
                return;
            }

            container.innerHTML = '';
            langs.forEach((item, index) => {
                const badge = document.createElement('div');
                badge.className = 'lang-badge';

                const detailSpan = item.detail ? `<span class="spec-detail-text">(${item.detail})</span>` : '';

                badge.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="color: var(--text-sub);">-</span>
                            <span>${item.name} ${detailSpan}</span>
                        </div>
                        <button class="spec-delete-btn" title="삭제" data-index="${index}">✕</button>
                    `;

                badge.querySelector('.spec-delete-btn').addEventListener('click', () => {
                    deleteLang(index);
                });

                container.appendChild(badge);
            });
        }

        function addLang() {
            const nameInput = document.getElementById('newLangName');
            const detailInput = document.getElementById('newLangDetail');

            const name = nameInput.value.trim();
            if (!name) {
                alert('어학 시험명을 입력해주세요.');
                nameInput.focus();
                return;
            }

            const langs = getSavedLangs();
            langs.push({
                name: name,
                detail: detailInput.value.trim()
            });

            persistLangs(langs);
            nameInput.value = '';
            detailInput.value = '';
            renderLangs();
        }

        function deleteLang(index) {
            const langs = getSavedLangs();
            langs.splice(index, 1);
            persistLangs(langs);
            renderLangs();
        }

        document.getElementById('addLangBtn').addEventListener('click', addLang);
        document.getElementById('newLangName').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addLang();
        });
        document.getElementById('newLangDetail').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addLang();
        });

        /* 4. 채용 일정 및 캘린더 기능 */
        function getSavedCustomizations() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        }

        function saveCustomizations(customMap) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(customMap));
        }

        function getSavedJobs() {
            return JSON.parse(localStorage.getItem(JOBS_STORAGE_KEY) || "[]");
        }

        function persistJobs(jobs) {
            localStorage.setItem(JOBS_STORAGE_KEY, JSON.stringify(jobs));
        }

        jobsData = getSavedJobs();
        if (jobsData.length > 0) {
            document.getElementById('loadStatus').textContent = `공고 ${jobsData.length}건 유지됨`;
        }

        document.getElementById('jsonFileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                try {
                    let content = event.target.result.trim();
                    if (!content.startsWith('[')) {
                        content = '[' + content.replace(/,\s*$/, '') + ']';
                    }
                    const importedJobs = JSON.parse(content);
                    const currentIds = new Set(jobsData.map(j => getJobIdentifier(j)));

                    importedJobs.forEach(item => {
                        if (item.link) item.link = normalizeUrl(item.link);
                        if (!currentIds.has(getJobIdentifier(item))) {
                            jobsData.push(item);
                        }
                    });

                    persistJobs(jobsData);
                    document.getElementById('loadStatus').textContent = `공고 ${jobsData.length}건 등록됨`;
                    renderCalendar();
                } catch (err) {
                    alert("JSON 파싱에 실패했습니다. 올바른 JSON 형식인지 확인해주세요.");
                    console.error(err);
                }
            };
            reader.readAsText(file);
        });

        function getJobIdentifier(job) {
            return `${job.company}_${job.endDate}_${job.link || ''}`;
        }

        document.getElementById('prevMonthBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonthBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        function formatDate(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function openOrCreateWordDocument(companyName) {
            const encodedCompany = encodeURIComponent(companyName);
            window.location.href = `myword://${encodedCompany}`;
        }

        const toggleDeleteBtn = document.getElementById('toggleDeleteModeBtn');
        toggleDeleteBtn.addEventListener('click', () => {
            if (!isDeleteMode) {
                isDeleteMode = true;
                selectedJobIdsToDelete.clear();
                toggleDeleteBtn.classList.add('active-mode');
                toggleDeleteBtn.textContent = 'CONFIRM DELETE';
                renderCalendar();
            } else {
                if (selectedJobIdsToDelete.size === 0) {
                    isDeleteMode = false;
                    toggleDeleteBtn.classList.remove('active-mode');
                    toggleDeleteBtn.textContent = 'DELETE';
                    renderCalendar();
                } else {
                    document.getElementById('confirmDeleteModal').classList.add('active');
                }
            }
        });

        document.getElementById('btnDeleteNo').addEventListener('click', () => {
            document.getElementById('confirmDeleteModal').classList.remove('active');
        });

        document.getElementById('btnDeleteYes').addEventListener('click', () => {
            const customMap = getSavedCustomizations();
            selectedJobIdsToDelete.forEach(id => {
                delete customMap[id];
            });
            saveCustomizations(customMap);

            jobsData = jobsData.filter(job => !selectedJobIdsToDelete.has(getJobIdentifier(job)));
            persistJobs(jobsData);

            selectedJobIdsToDelete.clear();
            isDeleteMode = false;
            toggleDeleteBtn.classList.remove('active-mode');
            toggleDeleteBtn.textContent = 'DELETE';
            document.getElementById('confirmDeleteModal').classList.remove('active');
            document.getElementById('loadStatus').textContent = jobsData.length > 0 ? `공고 ${jobsData.length}건 유지됨` : 'No Data';
            renderCalendar();
        });

        const resetAllBtn = document.getElementById('resetAllBtn');
        const confirmResetAllModal = document.getElementById('confirmResetAllModal');

        resetAllBtn.addEventListener('click', () => {
            confirmResetAllModal.classList.add('active');
        });

        document.getElementById('btnResetAllNo').addEventListener('click', () => {
            confirmResetAllModal.classList.remove('active');
        });

        document.getElementById('btnResetAllYes').addEventListener('click', () => {
            jobsData = [];
            persistJobs(jobsData);
            saveCustomizations({});
            selectedJobIdsToDelete.clear();

            if (isDeleteMode) {
                isDeleteMode = false;
                toggleDeleteBtn.classList.remove('active-mode');
                toggleDeleteBtn.textContent = 'DELETE';
            }

            document.getElementById('jsonFileInput').value = '';
            document.getElementById('loadStatus').textContent = 'No Data';
            confirmResetAllModal.classList.remove('active');
            renderCalendar();
        });

        const addJobModal = document.getElementById('addJobModal');
        document.getElementById('openAddJobModalBtn').addEventListener('click', () => {
            document.getElementById('newCompanyName').value = '';
            document.getElementById('newJobEndDate').value = formatDate(new Date());
            document.getElementById('newJobLink').value = '';
            addJobModal.classList.add('active');
        });

        document.getElementById('closeAddJobModalBtn').addEventListener('click', () => {
            addJobModal.classList.remove('active');
        });

        document.getElementById('saveNewJobBtn').addEventListener('click', () => {
            const compName = document.getElementById('newCompanyName').value.trim();
            const endDate = document.getElementById('newJobEndDate').value;
            const rawLink = document.getElementById('newJobLink').value.trim();

            if (!compName) {
                alert('회사 이름을 입력해주세요.');
                return;
            }
            if (!endDate) {
                alert('마감일을 선택해주세요.');
                return;
            }

            const link = rawLink ? normalizeUrl(rawLink) : '';
            const newJob = { company: compName, endDate: endDate, link: link };
            jobsData.push(newJob);
            persistJobs(jobsData);
            document.getElementById('loadStatus').textContent = `공고 ${jobsData.length}건 유지됨`;
            addJobModal.classList.remove('active');
            renderCalendar();
        });

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendarTitle').textContent = `${year}. ${String(month + 1).padStart(2, '0')}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDayCurrentMonth = new Date(year, month + 1, 0).getDate();
            const lastDayPrevMonth = new Date(year, month, 0).getDate();

            const customMap = getSavedCustomizations();

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = lastDayPrevMonth - i;
                grid.appendChild(createDayCell(dayNum, true, false, false));
            }

            for (let day = 1; day <= lastDayCurrentMonth; day++) {
                const dayDate = new Date(year, month, day);
                const dateString = formatDate(dayDate);
                const dayOfWeek = dayDate.getDay();

                const cell = createDayCell(day, false, dayOfWeek === 0, dayOfWeek === 6);
                const eventsContainer = cell.querySelector('.events-container');

                const matchedJobs = jobsData.filter(job => job.endDate === dateString);

                matchedJobs.forEach((job) => {
                    const jobId = getJobIdentifier(job);
                    const jobCustom = customMap[jobId] || {
                        color: 'indigo',
                        memo: '',
                        showQuickLink: false,
                        quickLink: ''
                    };

                    const cardWrapper = document.createElement('div');
                    cardWrapper.className = `job-card-wrapper color-${jobCustom.color}`;

                    const jobEl = document.createElement('div');
                    jobEl.className = `job-item color-${jobCustom.color}`;

                    if (isDeleteMode) {
                        const chk = document.createElement('input');
                        chk.type = 'checkbox';
                        chk.className = 'delete-checkbox';
                        chk.checked = selectedJobIdsToDelete.has(jobId);
                        chk.addEventListener('change', (e) => {
                            if (e.target.checked) {
                                selectedJobIdsToDelete.add(jobId);
                            } else {
                                selectedJobIdsToDelete.delete(jobId);
                            }
                        });
                        jobEl.appendChild(chk);
                    }

                    const targetLink = normalizeUrl(job.link);
                    const linkEl = document.createElement('a');
                    linkEl.className = 'job-company';
                    linkEl.href = targetLink ? targetLink : 'javascript:void(0);';
                    if (targetLink) {
                        linkEl.target = '_blank';
                        linkEl.rel = 'noopener noreferrer';
                    }
                    linkEl.textContent = job.company;
                    jobEl.appendChild(linkEl);

                    const actionsEl = document.createElement('div');
                    actionsEl.className = 'job-actions';

                    const wordBtn = document.createElement('button');
                    wordBtn.className = 'job-btn job-btn-word';
                    wordBtn.title = `${job.company} 자소서 Word 파일 자동 열기/생성`;
                    wordBtn.textContent = 'W';
                    wordBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        openOrCreateWordDocument(job.company);
                    });

                    const editBtn = document.createElement('button');
                    editBtn.className = 'job-btn';
                    editBtn.innerHTML = 'SET';
                    editBtn.title = '공고 설정';
                    editBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        openCustomModal(job, jobId, jobCustom);
                    });

                    actionsEl.appendChild(wordBtn);
                    actionsEl.appendChild(editBtn);
                    jobEl.appendChild(actionsEl);

                    cardWrapper.appendChild(jobEl);

                    if (jobCustom.memo && jobCustom.memo.trim() !== '') {
                        const memoBox = document.createElement('div');
                        memoBox.className = 'job-memo-box';
                        memoBox.textContent = jobCustom.memo;
                        cardWrapper.appendChild(memoBox);
                    }

                    const directLink = normalizeUrl(jobCustom.quickLink);
                    if (jobCustom.showQuickLink && directLink) {
                        const linkBox = document.createElement('div');
                        linkBox.className = 'job-link-box';

                        const subLinkEl = document.createElement('a');
                        subLinkEl.className = 'job-sub-link';
                        subLinkEl.href = directLink;
                        subLinkEl.target = '_blank';
                        subLinkEl.rel = 'noopener noreferrer';
                        subLinkEl.innerHTML = '🔗 LINK';
                        subLinkEl.title = directLink;

                        linkBox.appendChild(subLinkEl);
                        cardWrapper.appendChild(linkBox);
                    }

                    eventsContainer.appendChild(cardWrapper);
                });

                grid.appendChild(cell);
            }

            const totalCells = firstDayIndex + lastDayCurrentMonth;
            const remainingDays = 7 - (totalCells % 7);
            if (remainingDays < 7) {
                for (let i = 1; i <= remainingDays; i++) {
                    grid.appendChild(createDayCell(i, true, false, false));
                }
            }
        }

        function createDayCell(dayNumber, isOtherMonth, isSunday, isSaturday) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            if (isOtherMonth) cell.classList.add('other-month');
            if (isSunday) cell.classList.add('sunday');
            if (isSaturday) cell.classList.add('saturday');

            const numEl = document.createElement('div');
            numEl.className = 'day-number';
            numEl.textContent = dayNumber;

            const eventsContainer = document.createElement('div');
            eventsContainer.className = 'events-container';

            cell.appendChild(numEl);
            cell.appendChild(eventsContainer);
            return cell;
        }

        const modal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalCompanyTitle');
        const modalMemo = document.getElementById('modalMemo');
        const modalShowQuickLink = document.getElementById('modalShowQuickLink');
        const modalQuickLink = document.getElementById('modalQuickLink');
        const colorSwatches = document.querySelectorAll('.color-swatch');
        let selectedColor = 'indigo';

        colorSwatches.forEach(swatch => {
            swatch.addEventListener('click', () => {
                colorSwatches.forEach(s => s.classList.remove('selected'));
                swatch.classList.add('selected');
                selectedColor = swatch.getAttribute('data-color');
            });
        });

        function openCustomModal(job, jobId, currentCustom) {
            activeCustomId = jobId;
            modalTitle.textContent = `${job.company} 설정`;
            modalMemo.value = currentCustom.memo || '';
            selectedColor = currentCustom.color || 'indigo';

            modalShowQuickLink.checked = !!currentCustom.showQuickLink;
            modalQuickLink.value = currentCustom.quickLink || '';

            colorSwatches.forEach(s => {
                s.classList.toggle('selected', s.getAttribute('data-color') === selectedColor);
            });

            modal.classList.add('active');
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.remove('active');
        });

        document.getElementById('saveCustomBtn').addEventListener('click', () => {
            if (!activeCustomId) return;
            const customMap = getSavedCustomizations();

            const rawQuickLink = modalQuickLink.value.trim();
            const formattedQuickLink = rawQuickLink ? normalizeUrl(rawQuickLink) : '';

            customMap[activeCustomId] = {
                color: selectedColor,
                memo: modalMemo.value.trim(),
                showQuickLink: modalShowQuickLink.checked,
                quickLink: formattedQuickLink
            };

            saveCustomizations(customMap);
            modal.classList.remove('active');
            renderCalendar();
        });

        // 초기 구동
        loadProfile();
        renderCerts();
        renderLangs();
        renderCalendar();
    </script>
</body>
</html>
